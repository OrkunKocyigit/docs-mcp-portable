# docs-portable configuration. Edit freely; changes apply on the next start.

[gpu]
# Where the embedding and reranker models run:
#   "none"     = CPU only (default, works everywhere).
#   "cuda"     = NVIDIA GPU. Installs onnxruntime-gpu plus the CUDA 13/cuDNN 9 runtime from pip
#                (~2.5 GB, no system CUDA needed); with [rerank] backend = "jina" also the CUDA
#                build of PyTorch (~2 GB). Needs a recent NVIDIA driver (CUDA 13).
#   "directml" = any DirectX 12 GPU (NVIDIA, AMD, Intel) via onnxruntime-directml. Smaller, but
#                Microsoft no longer develops DirectML; jina stays on the CPU.
# GPU builds are Windows x64 only. Switching reinstalls onnxruntime on the next start.
provider = "cuda"
# GPU index if there is more than one adapter (virtual display adapters count too).
device_id = 0

[embedding]
# Hugging Face repo that is downloaded on first run (its ONNX export is used).
model_repo = "BAAI/bge-m3"
# Model name exposed by the OpenAI-compatible endpoint and given to docs-mcp-server.
# NOTE: changing the model (or its dimension) makes docs-mcp-server drop stored vectors.
model_name = "bge-m3"
host = "127.0.0.1"
port = 8081
# CPU threads for inference, 0 = onnxruntime default.
threads = 0
# Weight quantization: "int8" (CPU only; on a GPU it is not applied and a warning is printed), "nf4" (CPU and
# CUDA, 4-bit) or "none". Quantized files are built once by `start.bat setup`. Changing it changes the
# vectors slightly: re-scrape libraries for best results.
quantization = "int8"
# Log every /v1/embeddings request.
access_log = false

# Cost limits, one set per device; the set matching where the model really runs is used.
#   batch_size = texts per ONNX forward pass (padded to the longest text in the batch).
#   max_length = truncation limit in tokens (bge-m3 supports up to 8192); attention memory grows with its square.
[embedding.cpu]
batch_size = 8
max_length = 8192

[embedding.gpu]
# Larger values can overflow the GPU: Windows then silently moves GPU memory into system RAM and everything
# becomes many times slower. docs-mcp-server chunks are up to ~1300 tokens, so 2048 truncates nothing it indexes.
batch_size = 2
max_length = 2048

[rerank]
# Re-scores the top hybrid-search candidates with a cross-encoder/listwise reranker before
# docs-mcp-server picks its results (patches docs-mcp-server, see README).
enabled = true
# "bge"  = BAAI/bge-reranker-v2-m3 (Apache-2.0), onnxruntime, no extra Python packages.
# "jina" = jinaai/jina-reranker-v3.5 (CC BY-NC 4.0 - NON-COMMERCIAL USE ONLY). Installs
#          torch + transformers (~1 GB, Windows x64 only) on the next start; uses the GPU with
#          [gpu] provider = "cuda".
backend = "bge"
# Required for backend = "jina": confirms this installation is for non-commercial use.
accept_noncommercial_license = true
host = "127.0.0.1"
port = 8082
# Weight quantization for either backend: "int8", "nf4" or "none".
#   bge  (ONNX): int8 on the CPU (model_int8.onnx, 570 MB); on a GPU int8 is not applied (warning) and the
#                fp16 file (1.1 GB) is used; nf4 is built once from the fp32 model (CPU and CUDA).
#   jina (PyTorch): int8 / nf4 via bitsandbytes on CUDA, int8 also on the CPU.
quantization = "int8"
# "auto" = follow `quantization`. Or name one file, which then ignores `quantization`:
# onnx/model_int8.onnx, onnx/model_fp16.onnx, onnx/model.onnx (fp32, 2.3 GB).
bge_onnx_file = "auto"
# Pairs per ONNX forward pass (bge) and CPU threads (0 = default).
batch_size = 8
threads = 0
access_log = false

# Cost limits, one set per device. The set matching where the reranker really runs is used
# ([rerank.cpu] also applies when a GPU was requested but is not usable).
#   candidates     = hybrid candidates re-scored per search. More = better reranking, slower search.
#                    docs-mcp-server only fetches limit * DOCS_MCP_SEARCH_OVERFETCH_FACTOR full-text
#                    candidates (5 * 2 = 10 by default); raise that factor in [docs_mcp.env] for more.
#   bge_max_length = tokens per (query, chunk) pair; docs-mcp-server chunks are up to ~1300 tokens.
#   timeout_ms     = if a rerank call takes longer, that search keeps its hybrid order.
[rerank.cpu]
# int8 bge on a CPU needs roughly 1.5 s per full-size chunk at 1024 tokens.
candidates = 10
bge_max_length = 512
timeout_ms = 30000

[rerank.gpu]
candidates = 30
bge_max_length = 1024
timeout_ms = 30000

[jev]
# Optional: autotrust/JEV-9B (Apache-2.0, a Qwen3.5-9B fine-tune) answering typed judgments locally, exposed to
# MCP clients by jev-mcp (MIT) as jev_verify, jev_screen, jev_rerank, jev_classify, ... at
# http://<mcp_host>:<mcp_port>/mcp. Nothing is sent to TypeSafe or any other hosted provider.
# Needs [gpu] provider = "cuda". Downloads about 18 GB (model) + 2 GB (CUDA PyTorch) on the next start.
enabled = false
# Weights on the GPU: "int8", "nf4" (smaller, may shift probabilities) or "bf16". Layers that do not fit
# are kept in RAM in bf16 (bitsandbytes cannot offload quantized layers) and streamed to the GPU per pass;
# beyond the RAM budget they are read from disk (very slow).
quantization = "int8"
# VRAM for weights in GB; 0 = free VRAM at start-up minus gpu_reserve_gb (the bge models load first).
# The reserve covers CUDA workspaces and layers streamed in from RAM (~2 GB measured on an 8 GB card); if it is
# too small Windows silently spills into shared memory and each pass takes a minute instead of a second.
gpu_memory_gb = 0
gpu_reserve_gb = 3.0
# RAM for offloaded layers in GB; 0 = available RAM minus 4 GB.
cpu_memory_gb = 0
# Prompt limits in tokens. States longer than max_state_tokens keep their first 60% and last 40%.
max_state_tokens = 1024
max_prompt_tokens = 4096
# Tokens per forward pass; several questions share one pass (and one trip of the offloaded layers).
batch_tokens = 8192
# Local System One endpoint (bearer-token protected, token generated per run) and the jev-mcp endpoint.
host = "127.0.0.1"
port = 8083
mcp_host = "127.0.0.1"
mcp_port = 8090
# Pinned @jkudish/jev-mcp version; installed into runtime\jev-mcp.
mcp_version = "0.14.7"
# jev-mcp gives up on a request after this many milliseconds.
request_timeout_ms = 600000
access_log = false

[code_search]
# Code page (http://<host>:<port>) to add local folders or git repositories, index them with cocoindex-code
# (Apache-2.0) and search them; read-only MCP endpoint at /mcp (list_projects, search_code).
# Embeddings: BAAI/bge-code-v1 (Apache-2.0, 1.5B parameters) on PyTorch from a local endpoint (embed_port).
# The next start installs cocoindex-code + PyTorch (CUDA build with [gpu] provider = "cuda") and downloads
# the model (~6.2 GB). Indexes, clones and settings stay in runtime\data\code.
enabled = true
host = "127.0.0.1"
port = 6290
embed_host = "127.0.0.1"
embed_port = 8084
# "int8" (GPU ~2 GB VRAM via bitsandbytes; CPU dynamic int8), "nf4" (GPU only, ~1.2 GB) or
# "none" (fp16 ~3.5 GB on a GPU, float32 on the CPU).
quantization = "int8"
# Git hosts the Code page may clone from (https only). Add self-hosted GitLab/Gitea hosts here.
git_hosts = ["github.com", "gitlab.com", "bitbucket.org", "codeberg.org"]
# git clone/pull gives up after this many seconds.
clone_timeout_s = 1800
# Files larger than this are skipped when indexing.
max_file_size_kb = 1024
access_log = false

# Cost limits per device (texts per forward pass, tokens per chunk).
[code_search.cpu]
batch_size = 4
max_length = 1024

[code_search.gpu]
batch_size = 8
max_length = 1024

[docs_mcp]
package = "@arabold/docs-mcp-server"
# Pinned npm version. Use "latest" to always take the newest release.
version = "3.4.1"
host = "127.0.0.1"
port = 6280
# Usage telemetry of docs-mcp-server (off by default for a self-contained setup).
telemetry = false
# Download Playwright's Chromium on first run (needed to scrape JavaScript-rendered sites).
install_browser = true
# Extra command-line flags for docs-mcp-server, e.g. ["--read-only"].
extra_args = []

# Extra environment variables passed to docs-mcp-server, e.g. a GitHub token:
# [docs_mcp.env]
# GITHUB_TOKEN = "ghp_..."
[docs_mcp.env]

[node]
# Portable Node.js (docs-mcp-server needs >= 22).
version = "24.22.2"
